apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deploy-name

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx-service-name1

  template:
    metadata:
      labels:
        app: nginx-service-name1

    spec:
      containers:
        - name: web-container-name1
          image: nginx:latest
          ports:
            - containerPort: 80
